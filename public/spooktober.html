<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Spooktober overlay — AleksK9</title>
  <!-- OBS browser source. A still Spooktober logo with "Day N" under it and a soft orange light that flickers
       gently on it. The day switches at midnight by itself, so one browser source works all October.
       Options (add to the URL):
         ?day=12                    always show day 12 (testing / previews)
         ?tz=America/New_York       use this time zone instead of the streaming PC's clock
         ?align=left|right          line the logo up to one side instead of the middle
         ?lights=0                  no flicker: just the logo
       Outside October only the logo shows. Recommended browser source size: 1200 × 520. -->
  <link rel="preload" as="image" href="/assets/overlays/spooktober-logo.webp">
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    .wrap {
      /* Fit the whole graphic inside the browser source, with a little room for the glow. */
      --w: min(86vw, calc(100vh * 1.98));
      width: var(--w); height: 100%; margin: 0 auto; position: relative; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    body.left .wrap { margin-left: 0; } body.right .wrap { margin-right: 0; }
    .logo { width: 100%; height: auto; display: block; flex-shrink: 0; }
    .day { height: calc(var(--w) * 0.175); margin-top: calc(var(--w) * -0.012); flex-shrink: 0; }
    .day img { height: 100%; width: auto; display: block; }
    .day[hidden] { display: none; }

    /* Light on the artwork itself (a filter, so it always lines up with the logo and the day). */
    .wrap img { filter: brightness(1.05) saturate(1.06) drop-shadow(0 0 calc(var(--w) * .012) rgba(255,120,20,.32));
      animation: flicker 4.6s steps(1, end) infinite; }
    @keyframes flicker {
      0%   { filter: brightness(1.05) saturate(1.06) drop-shadow(0 0 calc(var(--w) * .012) rgba(255,120,20,.32)); }
      14%  { filter: brightness(1.02) saturate(1.03) drop-shadow(0 0 calc(var(--w) * .009) rgba(255,120,20,.24)); }
      17%  { filter: brightness(1.06) saturate(1.07) drop-shadow(0 0 calc(var(--w) * .013) rgba(255,125,25,.36)); }
      41%  { filter: brightness(1.04) saturate(1.05) drop-shadow(0 0 calc(var(--w) * .011) rgba(255,120,20,.3)); }
      44%  { filter: brightness(1.01) saturate(1.02) drop-shadow(0 0 calc(var(--w) * .008) rgba(255,120,20,.22)); }
      47%  { filter: brightness(1.05) saturate(1.06) drop-shadow(0 0 calc(var(--w) * .012) rgba(255,120,20,.33)); }
      72%  { filter: brightness(1.07) saturate(1.07) drop-shadow(0 0 calc(var(--w) * .014) rgba(255,130,30,.38)); }
      75%  { filter: brightness(1.03) saturate(1.04) drop-shadow(0 0 calc(var(--w) * .01) rgba(255,120,20,.27)); }
      90%  { filter: brightness(1.05) saturate(1.06) drop-shadow(0 0 calc(var(--w) * .012) rgba(255,120,20,.32)); }
    }

    /* Faint orange glow behind the logo, flickering out of step with the light on it. */
    .glow { position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse 34% 40% at 20% 44%, rgba(255,110,0,.2), transparent 70%),
                  radial-gradient(ellipse 34% 40% at 80% 46%, rgba(255,110,0,.18), transparent 70%),
                  radial-gradient(ellipse 40% 36% at 50% 40%, rgba(255,140,30,.14), transparent 70%);
      -webkit-mask-image: linear-gradient(to right, transparent, #000 10%, #000 90%, transparent), linear-gradient(to bottom, transparent, #000 12%, #000 88%, transparent);
      -webkit-mask-composite: source-in;
      mask-image: linear-gradient(to right, transparent, #000 10%, #000 90%, transparent), linear-gradient(to bottom, transparent, #000 12%, #000 88%, transparent);
      mask-composite: intersect;
      animation: glowflick 5.3s steps(1, end) infinite; }
    @keyframes glowflick { 0% { opacity: 1; } 11% { opacity: .75; } 14% { opacity: .95; } 38% { opacity: .85; } 41% { opacity: .65; } 44% { opacity: 1; } 69% { opacity: .9; } 81% { opacity: .7; } 84% { opacity: .95; } }

    body.no-lights .glow { display: none; }
    body.no-lights .wrap img { filter: none; animation: none; }
    @media (prefers-reduced-motion: reduce) { .wrap img, .glow { animation: none; } }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="wrap">
    <img class="logo" src="/assets/overlays/spooktober-logo.webp" alt="Spooktober">
    <div class="day" id="day" hidden><img id="day-img" alt=""></div>
  </div>
  <script>
    var q = new URLSearchParams(location.search);
    var fixedDay = parseInt(q.get('day'), 10), tz = q.get('tz') || '';
    if (q.get('align') === 'left' || q.get('align') === 'right') document.body.classList.add(q.get('align'));
    if (q.get('lights') === '0') document.body.classList.add('no-lights');

    /* Today's month and day on the streaming PC (or in ?tz=). */
    function today() {
      var d = new Date();
      if (tz) {
        try {
          var parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, month: 'numeric', day: 'numeric' }).formatToParts(d), o = {};
          parts.forEach(function (p) { o[p.type] = Number(p.value); });
          return { month: o.month, day: o.day };
        } catch (e) { /* unknown time zone: fall back to the PC clock */ }
      }
      return { month: d.getMonth() + 1, day: d.getDate() };
    }
    function src(n) { return '/assets/overlays/spooktober-day-' + n + '.webp'; }
    var shown = null;
    function update() {
      var t = today();
      var n = fixedDay >= 1 && fixedDay <= 31 ? fixedDay : (t.month === 10 ? t.day : 0);
      if (n === shown) return;
      shown = n;
      var box = document.getElementById('day'), img = document.getElementById('day-img');
      if (!n) { box.hidden = true; return; }
      var next = new Image();
      next.onload = function () {
        img.src = next.src; img.alt = 'Day ' + n; box.hidden = false;
        if (n < 31) new Image().src = src(n + 1);   /* have tomorrow ready */
      };
      next.src = src(n);
    }
    update();
    setInterval(update, 15000);
  </script>
</body>
</html>
