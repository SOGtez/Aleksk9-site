<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Spooktober overlay — AleksK9</title>
  <!-- OBS browser source. Shows the Spooktober logo with "Day N" under it, and switches to the next day
       at midnight by itself, so one browser source works for the whole month.
       Options (add to the URL):
         ?day=12                    always show day 12 (testing / previews)
         ?tz=America/New_York       use this time zone instead of the streaming PC's clock
         ?align=left|right          line the logo up to one side instead of the middle
         ?lights=0                  turn the flickering lights off
       Outside October only the logo shows. Recommended browser source size: 1200 × 520. -->
  <link rel="preload" as="image" href="/assets/overlays/spooktober-logo.webp">
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    .wrap {
      /* Fit the whole graphic inside the browser source, leaving a margin for the glow. */
      --w: min(86vw, calc(100vh * 1.98));
      width: var(--w); height: 100%; margin: 0 auto; position: relative; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .wrap > .lit, .wrap > .day { position: relative; z-index: 2; }
    .lit .logo { width: 100%; }

    /* ---------- Orange firelight: glows behind the logo, and the same flicker lighting the logo itself ---------- */
    .lights { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; animation: fadein 3s ease-out .3s forwards; }
    .light { position: absolute; border-radius: 50%; filter: blur(calc(var(--s) * 0.08)); width: var(--s); height: var(--s); transform: translate(-50%, -50%); }
    .l1 { --s: 38vw; left: 18%; top: 46%; background: radial-gradient(circle, rgba(255,110,0,.6) 0%, rgba(255,80,0,.24) 38%, transparent 68%); animation: flick1 5.3s infinite steps(1, end), sway 11s ease-in-out infinite alternate; }
    .l2 { --s: 38vw; left: 82%; top: 46%; background: radial-gradient(circle, rgba(255,120,10,.55) 0%, rgba(255,85,0,.22) 40%, transparent 68%); animation: flick2 6.7s infinite steps(1, end), sway 13s ease-in-out infinite alternate-reverse; }
    .l3 { --s: 44vw; left: 50%; top: 40%; background: radial-gradient(circle, rgba(255,150,30,.42) 0%, rgba(255,110,0,.15) 45%, transparent 70%); animation: flick3 4.1s infinite steps(1, end); }
    .l4 { --s: 30vw; left: 50%; top: 78%; background: radial-gradient(circle, rgba(255,120,0,.4) 0%, rgba(255,90,0,.14) 45%, transparent 70%); animation: flick2 7.9s infinite steps(1, end); }
    /* Light on top: an orange wash cut to the exact shape of the logo / day image, flickering out of step with the glows. */
    .lit { position: relative; width: 100%; }
    .shine { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: 0;
      -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      background: radial-gradient(ellipse 45% 70% at 18% 45%, rgba(255,140,20,.75), transparent 70%),
                  radial-gradient(ellipse 45% 70% at 82% 50%, rgba(255,120,0,.7), transparent 70%),
                  radial-gradient(ellipse 40% 60% at 50% 30%, rgba(255,190,80,.45), transparent 70%);
      animation: fadein 3s ease-out .3s forwards, shine 3.7s infinite steps(1, end) 3.3s; }
    .logo-shine { -webkit-mask-image: url(/assets/overlays/spooktober-logo.webp); mask-image: url(/assets/overlays/spooktober-logo.webp); }
    @keyframes shine { 0% { opacity: .5; } 8% { opacity: 1; } 11% { opacity: .22; } 14% { opacity: .75; } 36% { opacity: .55; } 40% { opacity: 1; } 43% { opacity: .3; } 46% { opacity: .85; } 66% { opacity: .7; } 69% { opacity: .18; } 72% { opacity: .65; } 89% { opacity: .95; } }
    @keyframes flick1 { 0% { opacity: 1; } 7% { opacity: .62; } 9% { opacity: .97; } 31% { opacity: .85; } 33% { opacity: .5; } 35% { opacity: .95; } 62% { opacity: 1; } 64% { opacity: .58; } 67% { opacity: .9; } 88% { opacity: .8; } }
    @keyframes flick2 { 0% { opacity: .92; } 12% { opacity: 1; } 27% { opacity: .75; } 29% { opacity: .95; } 51% { opacity: .85; } 74% { opacity: 1; } 76% { opacity: .68; } 79% { opacity: .9; } }
    @keyframes flick3 { 0% { opacity: .7; } 20% { opacity: 1; } 22% { opacity: .6; } 25% { opacity: .9; } 58% { opacity: .75; } 83% { opacity: 1; } }
    @keyframes sway { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -52%) scale(1.06); } }

    @keyframes fadein { to { opacity: 1; } }
    body.no-lights .lights, body.no-lights .shine { display: none; }
    /* Everything fades out before the edge of the browser source, so there is never a visible box on stream. */
    .lights {
      -webkit-mask-image: linear-gradient(to right, transparent, #000 9%, #000 91%, transparent), linear-gradient(to bottom, transparent, #000 10%, #000 90%, transparent);
      -webkit-mask-composite: source-in;
      mask-image: linear-gradient(to right, transparent, #000 9%, #000 91%, transparent), linear-gradient(to bottom, transparent, #000 10%, #000 90%, transparent);
      mask-composite: intersect;
    }
    body.left .wrap { margin-left: 0; } body.right .wrap { margin-right: 0; }
    .logo { width: 100%; height: auto; display: block; }
    .day { height: calc(var(--w) * 0.175); margin-top: calc(var(--w) * -0.012); position: relative; }
    .day img { height: 100%; width: auto; display: block; }
    .day img.in { animation: dayin .9s cubic-bezier(.2, 1.4, .4, 1) both; }
    @keyframes dayin { from { opacity: 0; transform: scale(.6) rotate(-4deg); filter: brightness(2.2); } }
    .day[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="lights" aria-hidden="true"><span class="light l1"></span><span class="light l2"></span><span class="light l3"></span><span class="light l4"></span></div>
  <div class="wrap">
    <div class="lit"><img class="logo" src="/assets/overlays/spooktober-logo.webp" alt="Spooktober"><span class="shine logo-shine" aria-hidden="true"></span></div>
    <div class="day" id="day" hidden><img id="day-img" alt=""><span class="shine" id="day-shine" aria-hidden="true"></span></div>
  </div>
  <script>
    var q = new URLSearchParams(location.search);
    var fixedDay = parseInt(q.get('day'), 10), tz = q.get('tz') || '';
    if (q.get('align') === 'left' || q.get('align') === 'right') document.body.classList.add(q.get('align'));
    if (q.get('lights') === '0') document.body.classList.add('no-lights');

    function today() {
      var d = new Date();
      if (tz) {
        try {
          var parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, month: 'numeric', day: 'numeric' }).formatToParts(d), o = {};
          parts.forEach(function (p) { o[p.type] = Number(p.value); });
          return { month: o.month, day: o.day };
        } catch (e) { /* unknown time zone: fall back to the PC clock */ }
      }
      return { month: d.getMonth() + 1, day: d.getDate() };
    }
    function src(n) { return '/assets/overlays/spooktober-day-' + n + '.webp'; }

    var shown = null;
    function update() {
      var t = today();
      var n = fixedDay >= 1 && fixedDay <= 31 ? fixedDay : (t.month === 10 ? t.day : 0);
      if (n === shown) return;
      shown = n;
      var box = document.getElementById('day'), img = document.getElementById('day-img');
      if (!n) { box.hidden = true; return; }
      var next = new Image();
      next.onload = function () {
        img.classList.remove('in'); void img.offsetWidth;   /* restart the animation */
        img.src = next.src; img.alt = 'Day ' + n; img.classList.add('in'); box.hidden = false;
        var sh = document.getElementById('day-shine'); sh.style.webkitMaskImage = sh.style.maskImage = 'url(' + next.src + ')';
        if (n < 31) new Image().src = src(n + 1);            /* have tomorrow ready */
      };
      next.src = src(n);
    }
    update();
    setInterval(update, 15000);
  </script>
</body>
</html>
