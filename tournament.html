<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R6 Siege Tournament — AleksK9</title>
  <meta name="description" content="AleksK9's Rainbow Six Siege community tournament. Brackets, rules, and sign-ups coming soon.">
  <meta name="theme-color" content="#0a0a0a">

  <!-- LINKS — keep in sync with index.html -->
  <script>
    const LINKS = {
      twitch:  'https://twitch.tv/aleksk9_',
      discord: '#',
      emman:   '#'
    };
  </script>

  <meta property="og:type" content="website">
  <meta property="og:title" content="R6 Siege Tournament — AleksK9">
  <meta property="og:description" content="Coming soon. Brackets, rules, and sign-ups.">
  <meta property="og:url" content="https://aleksk9.com/tournament">
  <meta property="og:image" content="/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-weight='800' font-size='34' fill='%23E10600'%3EA%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0a;
      --bg-elev: #111111;
      --fg: #ffffff;
      --fg-muted: rgba(255, 255, 255, 0.64);
      --line: rgba(255, 255, 255, 0.10);
      --accent: #E10600;
      --accent-hover: #ff1a12;
      --live: #FF2A2A;
      --nav-h: 68px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    svg { display: block; }
    h1, h2 { margin: 0; line-height: 1.05; letter-spacing: -0.03em; font-weight: 900; }
    p { margin: 0; }
    .container { width: 100%; max-width: 1120px; margin-inline: auto; padding-inline: 20px; }
    @media (min-width: 720px) { .container { padding-inline: 32px; } }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 52px; padding: 0 26px; border-radius: 999px;
      font-weight: 600; font-size: 16px; letter-spacing: -0.01em;
      border: 1px solid transparent;
      transition: transform .25s var(--ease), background-color .25s var(--ease),
                  border-color .25s var(--ease), box-shadow .25s var(--ease);
    }
    .btn:hover { transform: translateY(-2px); }
    .btn svg { width: 18px; height: 18px; }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 8px 28px -10px rgba(225,6,0,.6); }
    .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 14px 34px -10px rgba(225,6,0,.75); }
    .btn-ghost { background: transparent; color: var(--fg); border-color: rgba(255,255,255,.18); }
    .btn-ghost:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

    /* Nav (same as index.html) */
    .nav {
      position: sticky; top: 0; z-index: 50; height: var(--nav-h);
      background: rgba(10,10,10,.72);
      -webkit-backdrop-filter: saturate(140%) blur(14px);
      backdrop-filter: saturate(140%) blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .nav .container { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .wordmark { font-weight: 900; font-size: 20px; letter-spacing: -0.04em; display: inline-flex; align-items: center; gap: 8px; }
    .wordmark::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
    .nav-links { display: flex; align-items: center; gap: 6px; list-style: none; margin: 0; padding: 0; }
    .nav-links a {
      display: inline-block; padding: 8px 12px; border-radius: 8px;
      font-weight: 500; font-size: 14px; color: var(--fg-muted); position: relative;
      transition: color .2s var(--ease), background-color .2s var(--ease);
    }
    .nav-links a:hover, .nav-links a[aria-current="page"] { color: var(--fg); }
    .nav-links a::after {
      content: ""; position: absolute; left: 12px; right: 12px; bottom: 4px; height: 2px;
      background: var(--accent); transform: scaleX(0); transform-origin: left;
      transition: transform .3s var(--ease); border-radius: 2px;
    }
    .nav-links a:hover::after, .nav-links a[aria-current="page"]::after { transform: scaleX(1); }
    .nav-links .nav-cta { color: #fff; background: var(--accent); margin-left: 6px; }
    .nav-links .nav-cta:hover { background: var(--accent-hover); }
    .nav-links .nav-cta::after { display: none; }
    @media (max-width: 420px) { .nav-links a { padding: 8px 9px; font-size: 13px; } }

    /* Page */
    main { flex: 1; display: grid; place-items: center; position: relative; isolation: isolate; padding: 80px 0; text-align: center; overflow: hidden; }
    main::before {
      content: ""; position: absolute; z-index: -1; left: 50%; top: 50%;
      width: min(80vw, 720px); aspect-ratio: 1; transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(225,6,0,.30) 0%, rgba(225,6,0,.12) 32%, transparent 68%);
      filter: blur(40px); pointer-events: none;
    }
    main::after {
      content: "R6"; position: absolute; z-index: -2; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-weight: 900; font-size: clamp(220px, 40vw, 520px); letter-spacing: -0.08em; line-height: 1;
      color: rgba(255,255,255,.03); pointer-events: none; user-select: none;
    }
    .inner { display: flex; flex-direction: column; align-items: center; gap: 22px; max-width: 720px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent);
    }
    .eyebrow::before, .eyebrow::after { content: ""; width: 18px; height: 2px; background: var(--accent); }
    h1 { font-size: clamp(44px, 9vw, 96px); letter-spacing: -0.05em; line-height: .95; }
    h1 span { color: var(--accent); }
    .sub { font-size: clamp(17px, 2.4vw, 22px); color: var(--fg-muted); font-weight: 500; max-width: 46ch; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 6px; }
    @media (max-width: 460px) { .actions { flex-direction: column; width: 100%; } .actions .btn { width: 100%; } }

    .reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
    .reveal.is-visible { opacity: 1; transform: none; }
    .reveal[data-delay="1"] { transition-delay: .08s; }
    .reveal[data-delay="2"] { transition-delay: .16s; }
    .reveal[data-delay="3"] { transition-delay: .24s; }
    .no-js .reveal { opacity: 1; transform: none; }

    /* Footer (same as index.html) */
    .footer { border-top: 1px solid var(--line); padding: 28px 0; font-size: 14px; color: var(--fg-muted); }
    .footer .container { display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; }
    .footer a { color: var(--fg); transition: color .2s var(--ease); }
    .footer a:hover { color: var(--accent); }
    @media (min-width: 620px) { .footer .container { flex-direction: row; justify-content: space-between; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
      .reveal { opacity: 1; transform: none; }
    }
  </style>
</head>

<body class="no-js">
  <script>document.body.classList.remove('no-js');</script>

  <header class="nav">
    <div class="container">
      <a class="wordmark" href="/" aria-label="AleksK9 home">AleksK9</a>
      <nav aria-label="Primary">
        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/tournament" aria-current="page">Tournament</a></li>
          <li><a class="nav-cta" href="#" data-link="twitch" target="_blank" rel="noopener">Twitch</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" aria-labelledby="page-title">
    <div class="container">
      <div class="inner">
        <span class="eyebrow reveal">R6 Siege Tournament</span>
        <h1 id="page-title" class="reveal" data-delay="1">Coming <span>Soon</span></h1>
        <p class="sub reveal" data-delay="2">
          Brackets, rules, prize info, and sign-ups are on the way.
          Follow the stream so you don't miss the announcement.
        </p>
        <div class="actions reveal" data-delay="3">
          <a class="btn btn-primary" href="#" data-link="twitch" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            Watch on Twitch
          </a>
          <a class="btn btn-ghost" href="/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
            Back Home
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span data-year>2026</span> AleksK9</p>
      <p>Site by <a href="#" data-link="emman">Emman</a></p>
    </div>
  </footer>

  <script>
    document.querySelectorAll('[data-link]').forEach(function (a) {
      var url = LINKS[a.dataset.link];
      if (!url) return;
      a.href = url;
      if (url === '#') { a.removeAttribute('target'); a.setAttribute('aria-disabled', 'true'); }
    });
    var y = document.querySelector('[data-year]');
    if (y) y.textContent = new Date().getFullYear();

    var reveals = Array.prototype.slice.call(document.querySelectorAll('.reveal'));
    var vh = window.innerHeight || document.documentElement.clientHeight;
    /* Anything already on screen reveals immediately; the rest waits for scroll. */
    var pending = reveals.filter(function (el) {
      var r = el.getBoundingClientRect();
      if (r.top < vh * 0.92 && r.bottom > 0) { el.classList.add('is-visible'); return false; }
      return true;
    });
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
      pending.forEach(function (el) { io.observe(el); });
    } else {
      pending.forEach(function (el) { el.classList.add('is-visible'); });
    }
  </script>
</body>
</html>
